services:
  rails:
    build: .
    container_name: rails_app
    ports:
      - 3000:3000
    environment:
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    volumes:
      - files_volume:/rails/public/downloads
    
  nginx:
    image: nginx:latest
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - files_volume:/rails/public/downloads
      - ./config/nginx/ssl/:/etc/nginx/certs/
    depends_on:
      - rails
    
volumes:
  files_volume: